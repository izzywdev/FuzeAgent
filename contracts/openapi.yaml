openapi: 3.1.0
info:
  title: FuzeAgent Orchestrator API
  version: 0.1.0
  summary: The HTTP surface the deployed FuzeAgent orchestrator actually serves.
  description: >-
    FuzeAgent orchestrates autonomous AI agents: it creates agents, assigns them tasks,
    EXECUTES those tasks in containers and sandboxes, brokers agent-to-agent
    communication, and manages the knowledge and goal state behind all of it.


    WHAT THIS DOCUMENT IS. It describes the routes served by
    `services/orchestrator/main.py` — the FastAPI application the Helm chart deploys as
    the `orchestrator` pod on port 8000, reachable in-cluster at
    http://orchestrator:8000. Every path was read off an `@app.<method>` decorator by
    static analysis; the summaries are the handlers' own docstrings. Nothing here is
    aspirational.


    THE ONE THING TO UNDERSTAND BEFORE CALLING ANYTHING. FuzeAgent is not a CRUD API
    with a dangerous corner. Its core purpose is to DISPATCH AGENTS THAT TAKE REAL
    ACTIONS — they write files, run shell commands in containers, call third-party
    APIs and spend money on model inference. `POST /tasks/{task_id}/execute` is the
    canonical case: it returns quickly, and by the time it has, an agent is running.
    Cancelling it stops future work; it does not undo work already done. Operations of
    that shape are marked irreversible in `mcp/tools.overrides.yaml` regardless of
    their HTTP verb, because the verb says nothing about whether the effect can be
    taken back.


    WHAT IT IS NOT. FuzeAgent deploys a SECOND backend, `services/hierarchy_API`
    (the `hierarchy-api` pod, port 8006), with roughly forty of its own routes for
    organizations, teams and agent hierarchy. It is a separate FastAPI application on
    a separate Service and is NOT covered by this document; a single OpenAPI document
    maps to a single upstream base URL, so it would need its own contract and its own
    gateway pod. See `contracts/README.md`.


    AUTHENTICATION. Bearer token, resolved through the FuzeFront Security API when
    `SECURITY_BASE_URL` is configured (`services/orchestrator/fuze_security.py`), with
    a local JWT fallback otherwise. `main:app` fails closed at boot without either.
  contact:
    name: FuzeAgent
    url: https://github.com/izzywdev/FuzeAgent
  license:
    name: UNLICENSED
servers:
  - url: /
    description: >-
      The orchestrator serves absolute paths with no common prefix, so the base URL
      carries no path segment. In-cluster: http://orchestrator:8000.
tags:
  - name: Platform
    description: Health, websocket stats and system dashboards.
  - name: Agents
    description: Creating, inspecting and configuring agents.
  - name: Tasks
    description: >-
      Assigning and EXECUTING work. The operations here are the ones that make an
      agent act on the world.
  - name: Containers
    description: Per-agent container lifecycle and in-container command execution.
  - name: Sandboxes
    description: Sandbox lifecycle and arbitrary command execution inside one.
  - name: Coordination
    description: Multi-agent coordination sessions and agent-to-agent messaging.
  - name: Conversations
    description: Agent conversations and the derived artefacts (milestones, action items).
  - name: Goals
    description: Organizational goals, milestones and progress tracking.
  - name: Knowledge
    description: Documents, RAG index and knowledge analytics.
  - name: Context
    description: Agent interaction context.
  - name: MCP passthrough
    description: >-
      The orchestrator's own MCP client surface — listing and calling tools of MCP
      servers the AGENTS use. Not to be confused with FuzeAgent's MCP gateway pod,
      which exposes THIS API as MCP tools.
  - name: Organizations
    description: Organization-scoped model, provider and dashboard configuration.
