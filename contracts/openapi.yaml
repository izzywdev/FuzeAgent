  "/openapi.yaml":
    get:
      operationId: getOpenapiDocument
      tags: ["Platform"]
      summary: "This OpenAPI document"
      description:
        |-
          Unauthenticated. Serves contracts/openapi.yaml — the document you are reading — from the copy baked into the image, so what the API publishes is always the contract this build was compiled against.

          This is NOT /openapi.json. That endpoint is FastAPI's auto-generated schema: it is derived from the code at import time and carries no curated descriptions, no tags beyond the decorators, and — critically — none of the irreversibility guidance in mcp/tools.overrides.yaml. Both are served; this one is the contract.

          Answers 503 if the image was built without its contract. A missing document is degraded, not fatal — no restart can conjure a file the image lacks.
      security: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { type: object }
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer token. Resolved through the FuzeFront Security API when
        SECURITY_BASE_URL is set; local JWT verification otherwise.
  schemas:
    Error:
      type: object
      description: FastAPI's error shape.
      properties:
        detail:
          description: Human-readable error, or a validation-error array.
security:
  - bearerAuth: []
