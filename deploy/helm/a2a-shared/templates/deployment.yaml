{{- if .Values.a2a.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "a2a.name" . }}
  labels:
    {{- include "a2a.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deploy.replicas }}
  selector:
    matchLabels:
      {{- include "a2a.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "a2a.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the values document (tenants/auth/etc.) changes — a
        # ConfigMap update alone does not restart the pod.
        checksum/values: {{ include (print $.Template.BasePath "/values-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.deploy.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Matches the image's non-root USER 10001 (agent-templates/a2a/Dockerfile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: {{ include "a2a.name" . }}
          image: "{{ .Values.a2a.image.repository }}:{{ .Values.a2a.image.tag }}"
          imagePullPolicy: {{ .Values.a2a.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Entrypoint is `python -m a2a.runtime` (the image CMD). The listen port comes
          # from the values file (service.port), not an env var, so container port and
          # the served port share one source.
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.port }}
          env:
            # Bind all interfaces so the in-cluster Service reaches the pod (the server
            # defaults to loopback). Everything else (auth, tenants, protocolVersion,
            # card keyId) the server reads from A2A_VALUES_FILE — NOT per-var env.
            - name: HOST
              value: "0.0.0.0"
            - name: A2A_VALUES_FILE
              value: /config/values.json
            # NOTE (#203 slice 3): the `repo-sync` init container that used to populate
            # this path was removed — cards for a registry-sourced tenant now arrive as
            # data (tenant-registration.md), no server-side clone. `A2A_REPOS_DIR` /
            # the `repos` volume below are left wired ONLY for the static `a2a.tenants[]`
            # topology (LocalRepoResolver), which Slice 5 retires; until then a static
            # tenant with no matching registry entry finds `/repos/<tenant>` empty.
            - name: A2A_REPOS_DIR
              value: /repos
            - name: AGENT_PROVIDER
              value: {{ .Values.deploy.agentProvider | quote }}
            - name: FUZE_STATE_DIR
              value: /state
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- with .Values.deploy.providerApiKeySecretRef }}
            # Managed-Agents API key for session provisioning (sync/common.py _api_key()).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- with .Values.deploy.mcp }}
            # MCP endpoints for every provisioned agent's _base servers
            # (roles/_base/role.json: github url ${GITHUB_MCP_URL}, handoff url
            # ${HANDOFF_MCP_URL}). Each takes EITHER a plain `url` OR a `urlSecretRef`
            # (use the secretRef when the URL embeds a credential), plus an optional
            # `tokenSecretRef` exported as <NAME>_MCP_TOKEN. Unset -> role_loader logs
            # the drop at WARNING and the agent starts WITHOUT those tools (never silent).
            {{- with .github }}
            {{- if .urlSecretRef }}
            - name: GITHUB_MCP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .urlSecretRef.name }}
                  key: {{ .urlSecretRef.key }}
            {{- else if .url }}
            - name: GITHUB_MCP_URL
              value: {{ .url | quote }}
            {{- end }}
            {{- with .tokenSecretRef }}
            - name: GITHUB_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- with .handoff }}
            {{- if .urlSecretRef }}
            - name: HANDOFF_MCP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .urlSecretRef.name }}
                  key: {{ .urlSecretRef.key }}
            {{- else if .url }}
            - name: HANDOFF_MCP_URL
              value: {{ .url | quote }}
            {{- end }}
            {{- with .tokenSecretRef }}
            - name: HANDOFF_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- end }}
          # The server exposes GET /healthz (verified against the built image's
          # composed Starlette routes: /rpc, /.well-known/agent-card.json,
          # /extendedAgentCard, /healthz).
          # Tuned for a slow-start server under load. A startupProbe gives it time to
          # boot (registry fetch + provider init) before liveness/readiness apply;
          # liveness is tolerant (5s timeout, 6 failures × 30s) so a briefly-slow
          # /healthz doesn't restart it (was killing the pod on the default 1s timeout
          # under cluster strain). Kept generous post-#203 even though server-side repo
          # cloning is gone (the old dominant cost) — a slow/unreachable
          # A2A_REGISTRY_URL fetch, though it fails closed to the static source rather
          # than blocking boot, still shares this budget with provider init.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30        # up to ~5min to become healthy
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6         # ~3min of unresponsiveness before restart
          volumeMounts:
            - name: values
              mountPath: /config
              readOnly: true
            - name: repos
              mountPath: /repos
            - name: state
              mountPath: /state
            {{- if and .Values.a2a.auth .Values.a2a.auth.mtls }}
            {{- if and .Values.a2a.auth.mtls.enabled .Values.a2a.auth.mtls.caSecretRef }}
            - name: mtls-ca
              mountPath: /etc/a2a/mtls
              readOnly: true
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.deploy.resources | nindent 12 }}
      volumes:
        - name: values
          configMap:
            name: {{ include "a2a.name" . }}-values
        - name: repos
          emptyDir: {}
        # writable scratch for FUZE_STATE_DIR — the server persists in-flight session
        # state here (run_until_block). Must be writable, so emptyDir, not a read-only
        # ConfigMap. Ephemeral is fine for v1 (in-flight tasks don't survive a restart).
        - name: state
          emptyDir: {}
        {{- if and .Values.a2a.auth .Values.a2a.auth.mtls }}
        {{- if and .Values.a2a.auth.mtls.enabled .Values.a2a.auth.mtls.caSecretRef }}
        - name: mtls-ca
          secret:
            secretName: {{ .Values.a2a.auth.mtls.caSecretRef.name }}
            items:
              - key: {{ .Values.a2a.auth.mtls.caSecretRef.key }}
                path: ca.crt
        {{- end }}
        {{- end }}
{{- end }}
