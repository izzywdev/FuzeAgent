{{- if .Values.a2a.enabled }}
apiVersion: v1
kind: Service
metadata:
  # MUST be `a2a-shared`: this chart leaves `a2a.inClusterUrl` unset, so cards advertise
  # the card-projection.md §2 default http://a2a-shared.fuzeagent.svc.cluster.local:8080/rpc
  # and THIS Service is what that name must resolve to. Rename one and you must rename both.
  name: {{ include "a2a.name" . }}
  labels:
    {{- include "a2a.labels" . | nindent 4 }}
spec:
  # ClusterIP only — ingress is Cloudflare-tunnel-only (no LoadBalancer/NodePort).
  type: {{ .Values.a2a.service.type }}
  selector:
    {{- include "a2a.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.a2a.service.port }}
      targetPort: http
{{- end }}
