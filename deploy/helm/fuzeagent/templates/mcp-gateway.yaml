{{- if .Values.mcp.enabled }}
{{/*
FuzeAgent MCP SSE gateway — the product's THIRD pod (backend, frontend, MCP).

It runs the shared @fuzefront/mcp-gateway image, which contains no FuzeAgent
logic: everything that makes this pod "the FuzeAgent gateway" is the spec and
the upstream URL below. Other products deploy the same image with their own.

The spec and the mutation overrides are mounted from a ConfigMap rendered out of
deploy/helm/fuzeagent/files/, which are COPIES of contracts/openapi.yaml and
mcp/tools.overrides.yaml. Helm cannot read files outside the chart directory, so
the copies are unavoidable — run scripts/sync-chart-files.sh --check to prove they
have not drifted (it exits non-zero if they have).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeagent-mcp-spec
  labels:
    app.kubernetes.io/name: fuzeagent
    app.kubernetes.io/component: mcp-gateway
data:
  openapi.yaml: |-
{{ .Files.Get "files/openapi.yaml" | indent 4 }}
  tools.overrides.yaml: |-
{{ .Files.Get "files/tools.overrides.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzeagent-mcp
  labels:
    app.kubernetes.io/name: fuzeagent
    app.kubernetes.io/component: mcp-gateway
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      app: fuzeagent-mcp
  template:
    metadata:
      labels:
        app: fuzeagent-mcp
        app.kubernetes.io/component: mcp-gateway
      annotations:
        # Roll the pod when the spec or the overrides change, otherwise a
        # contract change would leave a stale tool surface serving indefinitely.
        checksum/spec: {{ .Files.Get "files/openapi.yaml" | sha256sum }}
        checksum/overrides: {{ .Files.Get "files/tools.overrides.yaml" | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-gateway
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.port }}
          env:
            - name: MCP_PRODUCT
              value: agent
            # In-cluster base URL of the FuzeAgent REST API. The gateway makes
            # every upstream call here, carrying the CALLER'S bearer token.
            - name: MCP_UPSTREAM_BASE_URL
              value: {{ .Values.mcp.upstreamBaseUrl | quote }}
            - name: MCP_OPENAPI_SPEC
              value: /spec/openapi.yaml
            - name: MCP_TOOL_OVERRIDES
              value: /spec/tools.overrides.yaml
            - name: PORT
              value: {{ .Values.mcp.port | quote }}
          # DELIBERATELY no credential env var. The gateway forwards the caller's
          # identity and holds none of its own; it refuses to start if a service
          # token is present, because a shared token would bypass every per-user
          # Permit check on the FuzeAgent API.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: spec
              mountPath: /spec
              readOnly: true
      volumes:
        - name: spec
          configMap:
            name: fuzeagent-mcp-spec
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeagent-mcp
  labels:
    app.kubernetes.io/name: fuzeagent
    app.kubernetes.io/component: mcp-gateway
spec:
  type: ClusterIP
  selector:
    app: fuzeagent-mcp
  ports:
    - name: http
      port: {{ .Values.mcp.port }}
      targetPort: http
{{- end }}
