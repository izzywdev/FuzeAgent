apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fuzeagent.fullname" . }}-incident-alerts
  labels:
    {{- include "fuzeagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: alerting
    prometheus_rule: "1"
# PromQL ONLY. FuzeInfra's Prometheus loads every `prometheus_rule: "1"` ConfigMap in
# the cluster, and one unparseable expression stops it from starting. This file used
# to also carry PostgresVolumeCorrupted, a LogQL log query
# (`{namespace=~"..."} |= "Input/output error"`). From 2026-10-13 it kept the shared
# Prometheus crash-looping for 15 days, which turned off metric alerting for every
# product. That alert now lives in Loki, where log queries belong:
# izzywdev/FuzeInfra helm/fuzeinfra/loki-rules/fuzeinfra-log-alerts.yaml
# (same alertname, labels and annotations). Log-based alerts go there via `@fuze`
# to FuzeInfra, never here. Check edits with `promtool check rules`.
data:
  incident-alerts.yaml: |
    groups:
      - name: fuzeagent.incident.rules
        rules:
          # FuzeFront Applications down or degraded
          - alert: FuzefrontApplicationsDown
            expr: |
              kube_pod_status_phase{namespace="fuzefront", pod=~"fuzefront-applications-.*", phase!="Running"} > 0
              or
              sum(rate(nginx_ingress_controller_requests{status=~"5.*", exported_service=~"fuzefront-applications"}[5m])) > 0.05
            for: 1m
            labels:
              severity: critical
              component: fuzefront-applications
              action: auto-remediate
            annotations:
              summary: "FuzeFront applications service down or failing health checks"
              description: "fuzefront-applications pod is not ready or failing database connections. Automated remediation triggered."
