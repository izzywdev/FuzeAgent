apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fuzeagent.fullname" . }}-incident-alerts
  labels:
    {{- include "fuzeagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: alerting
    prometheus_rule: "1"
data:
  incident-alerts.yaml: |
    groups:
      - name: fuzeagent.incident.rules
        rules:
          # Alert 1: Filesystem / Volume I/O corruption (ext4 EIO or bad message)
          - alert: PostgresVolumeCorrupted
            expr: |
              sum by (namespace, pod) (
                count_over_time({namespace=~"fuzeinfra|fuzeagent"} |= "Input/output error"[5m]) +
                count_over_time({namespace=~"fuzeinfra|fuzeagent"} |= "bad message"[5m])
              ) > 0
            for: 30s
            labels:
              severity: critical
              component: fuzeinfra-postgres
              action: auto-remediate
            annotations:
              summary: "Filesystem I/O corruption detected on {{ `{{ $labels.pod }}` }}"
              description: "ext4 metadata or inode read error reported in logs on {{ `{{ $labels.pod }}` }}. Automated remediation triggered."

          # Alert 2: FuzeFront Applications down or degraded
          - alert: FuzefrontApplicationsDown
            expr: |
              kube_pod_status_phase{namespace="fuzefront", pod=~"fuzefront-applications-.*", phase!="Running"} > 0
              or
              sum(rate(nginx_ingress_controller_requests{status=~"5.*", exported_service=~"fuzefront-applications"}[5m])) > 0.05
            for: 1m
            labels:
              severity: critical
              component: fuzefront-applications
              action: auto-remediate
            annotations:
              summary: "FuzeFront applications service down or failing health checks"
              description: "fuzefront-applications pod is not ready or failing database connections. Automated remediation triggered."
