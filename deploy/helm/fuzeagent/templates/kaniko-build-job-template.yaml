apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fuzeagent.fullname" . }}-kaniko-template
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fuzeagent.labels" . | nindent 4 }}
data:
  job-template.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: kaniko-build-AGENT_IMAGE_TAG
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/name: kaniko-builder
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      ttlSecondsAfterFinished: 600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kaniko-builder
        spec:
          restartPolicy: Never
          containers:
          - name: kaniko
            image: gcr.io/kaniko-project/executor:v1.23.2-debug
            args:
            - "--dockerfile=/workspace/Dockerfile"
            - "--context=dir:///workspace"
            - "--destination=TARGET_IMAGE_DESTINATION"
            - "--cache=true"
            - "--cache-dir=/cache"
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "2000m"
                memory: "4Gi"
            securityContext:
              runAsNonRoot: false
              allowPrivilegeEscalation: false
            volumeMounts:
            - name: dockerfile-storage
              mountPath: /workspace
            - name: registry-creds
              mountPath: /kaniko/.docker
            - name: kaniko-cache
              mountPath: /cache
          volumes:
          - name: dockerfile-storage
            configMap:
              name: DOCKERFILE_CONFIG_MAP_NAME
          - name: registry-creds
            secret:
              secretName: {{ .Values.imageRegistry.secretName | default "harbor-registry-creds" }}
              items:
              - key: .dockerconfigjson
                path: config.json
          - name: kaniko-cache
            emptyDir: {}
