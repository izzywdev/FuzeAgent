# ServiceAccount + RBAC for the orchestrator (creates/deletes k8s Jobs for claude-runner).
serviceAccount:
  # Set to true to create the ServiceAccount, Role, and RoleBinding.
  create: true
  # Override the generated name; leave empty to use <release>-orchestrator.
  name: ""

# =============================================================================
# FuzeAgent default values (local/dev shape). Production overrides live in
# values-prod.yaml (GHCR image tags rewritten by release.yml, prod ingress host).
# Service names deliberately match docker-compose (postgres/redis/rabbitmq/
# orchestrator/hierarchy-api/mcp-server/ui) so the app's hardcoded internal hosts
# and the orchestrator entrypoint's host waits resolve inside the namespace.
# =============================================================================

global:
  imagePullPolicy: IfNotPresent

# GHCR pull secret (sealed; must match the name in the SealedSecret). Empty here
# for local charts that use locally-built images.
imagePullSecrets: []

# Workloads read env from this Secret (materialised from a SealedSecret in prod).
secret:
  existingSecret: fuzeagent-secrets

# --- Application services -----------------------------------------------------
orchestrator:
  enabled: true
  image:
    repository: fuzeagent-orchestrator
    tag: latest
  port: 8000
  replicas: 1
  # Safe first-light: NO autonomous container spawning / file ops / docker.sock on
  # the shared single-node cluster. MCP is fine (no host escape surface).
  execution:
    autonomous: false
    multiAgent: false
    fileOps: false
    mcp: true
  runMigrations: true
  # Identity + authorization come from the FuzeFront Security API when
  # `securityBaseUrl` is set: the orchestrator resolves callers via
  # GET /v1/security/session and asks POST /v1/security/authz/check for every
  # decision, so it holds no signing key and names no identity/policy vendor.
  # Empty here because the default chart is the standalone/local shape — the
  # platform value lives in values-prod.yaml.
  # main:app fails closed without EITHER a security base URL or JWT material;
  # CORS must be non-wildcard.
  auth:
    securityBaseUrl: ""
    securityTimeoutSeconds: 5
    # Legacy local-verification fallback — used only when securityBaseUrl is empty.
    jwtAlgorithm: HS256
    jwtAudience: ""
    jwtIssuer: ""
    corsAllowOrigins: "http://localhost:3000,http://localhost:3031"
  resources:
    requests: { cpu: 150m, memory: 384Mi }
    limits: { cpu: "1", memory: 1Gi }

hierarchyApi:
  enabled: true
  image:
    repository: fuzeagent-hierarchy-api
    tag: latest
  port: 8006
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

ui:
  enabled: true
  image:
    repository: fuzeagent-ui
    tag: latest
  port: 3000
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

mcpServer:
  enabled: true
  image:
    repository: fuzeagent-mcp-server
    tag: latest
  port: 8001
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

# --- Namespaced datastores (self-contained first-light) -----------------------
postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  port: 5432
  database: ai_context
  user: postgres
  storage: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  storage: 1Gi
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

rabbitmq:
  enabled: true
  image: rabbitmq:3-management
  port: 5672
  managementPort: 15672
  user: admin
  storage: 2Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# --- Ingress (Traefik + Cloudflare tunnel; CF terminates TLS → no tls block) ---
ingress:
  enabled: true
  className: traefik
  host: fuzeagent.local
  annotations: {}

# --- federatedMount: same-origin FuzeFront-portal route for the UI's
# Module-Federation remote (templates/federated-mount-ingress.yaml). A SEPARATE
# surface from `ingress` above: this one lives on FuzeFront's OWN host
# (app.fuzefront.com), not fuzeagent's admin-console host, so the portal shell
# can import remoteEntry.js same-origin. `path` MUST match the UI's vite build
# `base` exactly (services/ui-react/vite.config.ts) or remoteEntry.js 200s and
# every chunk it references 404s. Disabled + hostless by default (mirrors
# FuzeX's deploy/helm/fuzex federatedMount): flipping `enabled` is a cross-repo
# routing decision — coordinate with FuzeFront's app.fuzefront.com Ingress
# rules first, same as FuzeX deferred it in its own values-prod.yaml.
federatedMount:
  enabled: false
  className: traefik
  host: ""
  annotations: {}
  path: /apps/fuzeagent

# --- Namespace guardrails on the shared node ----------------------------------
resourceGovernance:
  enabled: true
  quota:
    requestsCpu: "2"
    requestsMemory: 4Gi
    limitsCpu: "6"   # was 4; +room for a2a-shared (500m) + its rolling-update surge (go-live #93)
    limitsMemory: 8Gi
    pods: "20"
  limitRange:
    defaultCpu: 500m
    defaultMemory: 512Mi
    defaultRequestCpu: 100m
    defaultRequestMemory: 128Mi

# ---------------------------------------------------------------------------
# MCP SSE gateway — the config-driven @fuzefront/mcp-gateway pod.
#
# NOTE the distinction from `mcpServer` above. They are NOT the same thing and
# both are real:
#
#   mcpServer  mcp-servers/fuzeagent-server — a HAND-WRITTEN MCP SSE server with
#              ~15 curated tools over the hierarchy API. It ships today, and it
#              carries NO mutates/reversibility classification at all
#              (.fuze/manifest.json says so explicitly: "Outstanding: a
#              tools.json declaring `mutates` per tool").
#   mcp        THIS one — the shared gateway image, configured with
#              contracts/openapi.yaml + mcp/tools.overrides.yaml, which derives
#              the classification mechanically and REFUSES TO BOOT on a
#              self-contradictory one.
#
# That difference matters more on FuzeAgent than anywhere else in the family:
# this API dispatches agents that take real actions. A tool surface that
# presents `startTaskExecution` without saying it cannot be recalled is the
# specific failure the classification exists to prevent.
#
# Whether the hand-written server should be retired in favour of this pod is an
# owner decision, not a deployment one — both are left as they are, and the
# overlap is flagged in the PR body rather than resolved silently.
#
# Disabled by default: flipping it needs ghcr.io/izzywdev/fuze-mcp-gateway in
# GHCR, which NO workflow in this repo builds (it is FuzeFront's image).
# ---------------------------------------------------------------------------
mcp:
  enabled: false
  replicaCount: 1
  port: 8081
  image:
    repository: ghcr.io/izzywdev/fuze-mcp-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # In-cluster base URL of the ORCHESTRATOR. No path segment: the app serves
  # absolute paths with no common prefix, which is what
  # `servers: [{url: /}]` in contracts/openapi.yaml declares. `orchestrator` is
  # the Service created by templates/orchestrator.yaml.
  #
  # NOT the hierarchy API. services/hierarchy_API is a SECOND backend on a
  # second Service (port 8006) with its own ~40 routes, and one gateway pod
  # maps to exactly one spec and one upstream. Covering it needs its own
  # contract and its own pod — see contracts/README.md.
  upstreamBaseUrl: "http://orchestrator:8000"
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# ---------------------------------------------------------------------------
# FuzeFront self-registration (docs/mfe-self-registration.md).
#
# Cluster-internal service DNS on purpose, per @fuzefront/onboarding-kit: the
# init container has no reason to leave the cluster, and the public ingress host
# may not resolve before ingress is ready. Override per-environment if the
# applications service moves.
# ---------------------------------------------------------------------------
fuzefront:
  apiUrl: "http://fuzefront-applications.fuzefront.svc.cluster.local:3003"
