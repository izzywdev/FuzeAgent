# Handoff MCP server — the agent-to-agent orchestration carrier.
#
# Prod is GitOps under ArgoCD selfHeal — do NOT kubectl-apply by hand on prod; wire
# this into helm/fuzeinfra (or a dedicated Argo Application) and let Argo sync.
#
# Runtime inputs:
#   Secret  handoff-mcp-secret   -> ANTHROPIC_API_KEY   (SealedSecret; scripts/seal-secret.sh)
#   Secret  a2a-client-oidc      -> client-id, client-secret   (SealedSecret; the OIDC
#                                   client-credentials client FuzeFront provisions per
#                                   FuzeInfra#981 — see "A2A outbound identity" below)
#   ConfigMap handoff-state      -> agent-ids.json, vault-ids.json, memory-ids.json,
#                                   environment-ids.json
# The ConfigMap is produced in CI: check out the repo, run the sync scripts against
# the workspace (sync_environments -> sync_agents -> sync_vaults -> sync_memory), then
#   kubectl create configmap handoff-state --from-file=agent-templates/sync/.state \
#     --dry-run=client -o yaml > handoff-state.configmap.yaml   # commit -> Argo syncs
# The ids are NOT secrets (agent/env/vault/memory ids, not tokens), so committing them
# is fine. Rotate creds in the vault (sync_vaults) — no image/config change needed.
#
# HANDOFF_MCP_URL for the role agents = http://handoff-mcp.fuzeinfra.svc.cluster.local:8000/mcp
---
apiVersion: v1
kind: Service
metadata:
  name: handoff-mcp
  namespace: fuzeinfra
  labels:
    app.kubernetes.io/name: handoff-mcp
    app.kubernetes.io/part-of: agent-templates
spec:
  selector:
    app.kubernetes.io/name: handoff-mcp
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: handoff-mcp
  namespace: fuzeinfra
  labels:
    app.kubernetes.io/name: handoff-mcp
    app.kubernetes.io/part-of: agent-templates
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: handoff-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: handoff-mcp
    spec:
      containers:
        - name: handoff-mcp
          image: ghcr.io/izzywdev/fuzeinfra/agent-handoff:dev # bump via CI/release
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: handoff-mcp-secret, key: ANTHROPIC_API_KEY } }
            - name: FUZE_STATE_DIR
              value: /state
            # --- A2A outbound identity (FuzeInfra#981 runtime half) ---------------------
            # This server is the CALLER carrier (imports a2a_transport). To call a peer it
            # must present an `aud=a2a` OIDC bearer (authz.md §2). With no static A2A_TOKEN
            # set, a2a_transport builds a client-credentials token provider from these vars
            # (fuze_a2a_client.auth.token_provider_from_env) and mints/caches/refreshes the
            # token itself. client-id/secret come from the SealedSecret FuzeFront provisions
            # (repo-claim scope mapping); the secret value never leaves this pod's env.
            #
            # IDENTITY NOTE: one client_id => one `repo` claim on the wire, so this shared
            # carrier presents a single caller identity (the FuzeAgent-first rollout). True
            # per-caller identity would need per-tenant client credentials — out of scope here.
            #
            # NETWORKPOLICY: discovery/token are fetched in-cluster from authentik-server in
            # the `fuzefront` ns; fuzeinfra -> authentik-server:9000 egress must be admitted
            # (mirror of FuzeFront#373's fuzeagent allowance) or the mint fails closed.
            - name: A2A_CLIENT_ID
              valueFrom: { secretKeyRef: { name: a2a-client-oidc, key: client-id } }
            - name: A2A_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: a2a-client-oidc, key: client-secret } }
            - name: A2A_OIDC_DISCOVERY_URL
              value: http://authentik-server.fuzefront.svc.cluster.local:9000/application/o/fuzefront/.well-known/openid-configuration
            - name: A2A_TOKEN_AUDIENCE
              value: "a2a"
          volumeMounts:
            - name: state
              mountPath: /state
              readOnly: true
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: state
          configMap:
            name: handoff-state
