name: FuzeAgent Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: ai_context_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client netcat-openbsd
    
    - name: Install Python dependencies
      working-directory: services/orchestrator
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov faker httpx pytest-xdist
    
    - name: Setup test database
      run: |
        PGPASSWORD=password psql -h localhost -p 5434 -U postgres -d ai_context_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
        PGPASSWORD=password psql -h localhost -p 5434 -U postgres -d ai_context_test -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
    
    - name: Run database migrations
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        TESTING: 1
      run: |
        python -c "
        import asyncio
        from migration_manager import MigrationManager
        
        async def migrate():
            manager = MigrationManager('postgresql://postgres:password@localhost:5434/ai_context_test')
            result = await manager.migrate_up()
            print(f'Applied {len(result)} migrations')
        
        asyncio.run(migrate())
        "
    
    - name: Run unit tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "unit" -v --cov=. --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run API tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "api" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run database tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "database" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run integration tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "integration" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run RAG system tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "rag" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run A2A protocol tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "a2a" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run MCP server tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "mcp" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run Goals Management tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "goals" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: services/orchestrator/coverage.xml
        flags: backend
        name: fuzeagent-backend
        fail_ci_if_error: false
    
    - name: Generate coverage report
      working-directory: services/orchestrator
      run: |
        python -m pytest --cov=. --cov-report=html tests/ || true
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: services/orchestrator/htmlcov/
        retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    needs: test-backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      # `safety` 3.x requires an authenticated Safety-Platform session (it calls
      # out to its own OIDC/JWKS endpoint even for `safety check`) -- unusable
      # headless in CI without an account/API key. pip-audit (PyPA, backed by
      # the OSV.dev database) does the same job with no login required and is
      # actively maintained; this is a tool swap, not a scan skip.
      run: |
        pip install bandit pip-audit

    - name: Run Bandit security scan
      working-directory: services/orchestrator
      run: |
        bandit -r . --skip B101 -f json -o bandit-report.json || true
        bandit -r . --skip B101 -f txt

    - name: Check for known security vulnerabilities
      working-directory: services/orchestrator
      # The first run is the *record*: unfiltered, every finding, into the
      # uploaded artifact. The second run is the *gate*.
      #
      # The gate carries exactly two per-advisory exceptions. Both are findings
      # with NO upstream fix available -- not "noisy" findings, and not a way to
      # reach green. This is deliberately an explicit ID allow-list rather than a
      # blanket suppression or a `|| true`: any *new* advisory, and any new
      # version of these same packages picking up a *different* advisory, still
      # fails this step. Every fixable finding must be fixed by bumping the pin.
      #
      # PYSEC-2026-311 / CVE-2026-45829 / GHSA-f4j7-r4q5-qw2c -- chromadb
      #   Pre-auth code injection in the ChromaDB *server*'s
      #   POST /api/v2/tenants/{tenant}/databases/{db}/collections handler
      #   (trust_remote_code against an attacker-supplied model repo).
      #   No fix exists: `pip-audit` reports no fix version, and the current
      #   latest release (1.5.9) is still listed as affected -- so a bump is not
      #   on the table.
      #   Not reachable from this service: services/orchestrator/rag_integration.py
      #   uses chromadb.HttpClient() only -- FuzeAgent is a *client* of an
      #   external Chroma server (CHROMA_HOST/CHROMA_PORT) and never serves the
      #   vulnerable endpoint itself. Chroma appears in no Dockerfile, no compose
      #   file and no Helm chart in this repo. Hardening the Chroma server is the
      #   operator's (FuzeInfra's) responsibility, not this requirements file's.
      #   Revisit if upstream ships a fix, or if this repo ever runs Chroma.
      #
      # PYSEC-2026-1325 / CVE-2024-23342 / GHSA-wj6h-64fc-37mp -- ecdsa
      #   Minerva timing side-channel leaking the ECDSA nonce on P-256.
      #   No fix will ever exist: upstream python-ecdsa treats side-channel
      #   resistance as out of scope and has declined to fix; 0.19.2 is latest.
      #   Not removable by pinning either: python-jose declares `ecdsa!=0.15` as
      #   an unconditional install_requires, not behind an extra.
      #   Not reachable from this service: the advisory affects signing, key
      #   generation and ECDH, and explicitly states that signature
      #   *verification* is unaffected. services/orchestrator/auth.py only ever
      #   calls jwt.decode() -- verification -- with JWT_ALGORITHM defaulting to
      #   HS256. Nothing in this service signs with, or generates, an EC key.
      #   Real removal (tracked follow-up, deliberately not done in this PR
      #   because it edits authentication code): port auth.py from python-jose
      #   to PyJWT, already a declared dependency, which drops ecdsa entirely.
      run: |
        pip-audit -r requirements.txt --format=json --output=pip-audit-report.json || true
        pip-audit -r requirements.txt \
          --ignore-vuln PYSEC-2026-311 \
          --ignore-vuln PYSEC-2026-1325

    - name: Upload security reports
      uses: actions/upload-artifact@v7
      with:
        name: security-reports
        path: |
          services/orchestrator/bandit-report.json
          services/orchestrator/pip-audit-report.json
        retention-days: 30

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install linting tools
      run: |
        pip install black isort flake8 mypy
    
    - name: Check code formatting with Black
      working-directory: services/orchestrator
      run: |
        black --check --diff . || true
    
    - name: Check import sorting with isort
      working-directory: services/orchestrator
      run: |
        isort --check-only --diff . || true
    
    - name: Run flake8 linting
      working-directory: services/orchestrator
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run mypy type checking
      working-directory: services/orchestrator
      run: |
        mypy . --ignore-missing-imports --no-strict-optional || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, lint]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      working-directory: services/orchestrator
      run: |
        docker build -t fuzeagent-orchestrator:test .
    
    - name: Test Docker image
      run: |
        docker run --rm --entrypoint python fuzeagent-orchestrator:test -c "import main_with_hierarchy; print('Docker image works!')"

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: services/ui-react/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: services/ui-react
      run: npm ci --legacy-peer-deps
      # @izzywdev/fuzefront-identity is on GitHub Packages; see services/ui-react/.npmrc.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Run frontend linting
      working-directory: services/ui-react
      run: npm run lint
    
    - name: Run frontend type checking
      working-directory: services/ui-react
      run: npm run type-check
    
    - name: Build frontend
      working-directory: services/ui-react
      run: npm run build
    
    - name: Run unit tests
      working-directory: services/ui-react
      run: npm run test:run
      
    - name: Run tests with coverage
      working-directory: services/ui-react
      run: npm run test:coverage
    
    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: services/ui-react/coverage/coverage-summary.json
        flags: frontend
        name: fuzeagent-frontend
        fail_ci_if_error: false
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage-report
        path: services/ui-react/coverage/
        retention-days: 30

  performance-test:
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'pull_request'
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: ai_context_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      working-directory: services/orchestrator
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-benchmark
    
    - name: Run performance tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        TESTING: 1
      run: |
        python -m pytest tests/ -m "not slow" --benchmark-only --benchmark-json=benchmark.json || true
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results
        path: services/orchestrator/benchmark.json
        retention-days: 30