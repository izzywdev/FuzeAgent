name: FuzeAgent Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: ai_context_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client netcat-openbsd
    
    - name: Install Python dependencies
      working-directory: services/orchestrator
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov faker httpx pytest-xdist
    
    - name: Setup test database
      run: |
        PGPASSWORD=password psql -h localhost -p 5434 -U postgres -d ai_context_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
        PGPASSWORD=password psql -h localhost -p 5434 -U postgres -d ai_context_test -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
    
    - name: Run database migrations
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        TESTING: 1
      run: |
        python -c "
        import asyncio
        from migration_manager import MigrationManager
        
        async def migrate():
            manager = MigrationManager('postgresql://postgres:password@localhost:5434/ai_context_test')
            result = await manager.migrate_up()
            print(f'Applied {len(result)} migrations')
        
        asyncio.run(migrate())
        "
    
    - name: Run unit tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "unit" -v --cov=. --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run API tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "api" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run database tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "database" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run integration tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "integration" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run RAG system tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "rag" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run A2A protocol tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "a2a" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run MCP server tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "mcp" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Run Goals Management tests
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        ANTHROPIC_API_KEY: test-api-key
        TESTING: 1
      run: |
        python -m pytest tests/ -m "goals" -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing || [ $? -eq 5 ]
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: services/orchestrator/coverage.xml
        flags: backend
        name: fuzeagent-backend
        fail_ci_if_error: false
    
    - name: Generate coverage report
      working-directory: services/orchestrator
      run: |
        python -m pytest --cov=. --cov-report=html tests/ || true
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: services/orchestrator/htmlcov/
        retention-days: 30

  # Renamed from `security-scan`: ci.yml also has a job named `security-scan` (the
  # unrelated repo-wide Trivy filesystem SARIF scan at ci.yml:96) and both surfaced as a
  # check literally named "security-scan" with no way to tell them apart from the check
  # name alone — a red one was ambiguous, and it cost real diagnostic time distinguishing
  # "the bandit/pip-audit job broke" from "the Trivy fs scan broke" across three PRs.
  # Neither name is a required status check (branch protection requires only the
  # gate-* contexts from harden-gate.yml), so this rename does not un-gate anything.
  backend-security-scan:
    runs-on: ubuntu-latest
    needs: test-backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      # `safety` 3.x requires an authenticated Safety-Platform session (it calls
      # out to its own OIDC/JWKS endpoint even for `safety check`) -- unusable
      # headless in CI without an account/API key. pip-audit (PyPA, backed by
      # the OSV.dev database) does the same job with no login required and is
      # actively maintained; this is a tool swap, not a scan skip.
      run: |
        pip install bandit pip-audit

    - name: Run Bandit security scan
      working-directory: services/orchestrator
      run: |
        bandit -r . --skip B101 -f json -o bandit-report.json || true
        bandit -r . --skip B101 -f txt

    - name: Check for known security vulnerabilities
      working-directory: services/orchestrator
      # The first run is the *record*: unfiltered, every finding, into the
      # uploaded artifact. The second run is the *gate*.
      #
      # The gate carries exactly one per-advisory exception: a finding with NO
      # upstream fix available -- not a "noisy" finding, and not a way to
      # reach green. This is deliberately an explicit ID allow-list rather than
      # a blanket suppression or a `|| true`: any *new* advisory, and any new
      # version of this same package picking up a *different* advisory, still
      # fails this step. Every fixable finding must be fixed by bumping the pin.
      #
      # PYSEC-2026-311 / CVE-2026-45829 / GHSA-f4j7-r4q5-qw2c -- chromadb
      #   Pre-auth code injection in the ChromaDB *server*'s
      #   POST /api/v2/tenants/{tenant}/databases/{db}/collections handler
      #   (trust_remote_code against an attacker-supplied model repo).
      #   No fix exists: `pip-audit` reports no fix version. Re-verified
      #   directly against pip-audit for both endpoints of the prior 1.1.1 ->
      #   1.5.9 range: 1.1.1 shows `fix_versions: []`, and the current latest
      #   release (1.5.9) *also* shows `fix_versions: []` -- upgrading does
      #   not clear the advisory either way.
      #   The requirements.txt range (`chromadb>=0.5.0,<2.0.0`) already
      #   permits 1.5.9; what actually pins the resolved version to the
      #   1.1.x line is `crewai` (a direct, necessary dependency for agent
      #   orchestration), which has declared `chromadb~=1.1.0` in EVERY
      #   release since 0.201.0, including the current latest (1.15.17) --
      #   verified across the full crewai release history via the PyPI JSON
      #   API. The last crewai release with an open chromadb range
      #   (`chromadb>=0.5.23`) was 0.193.2, ~900 releases behind current.
      #   Forcing chromadb up would mean pinning crewai back to 0.193.2, a
      #   major, unrelated behavioural downgrade of the orchestration engine
      #   this service depends on -- not a reasonable trade for an advisory
      #   that, per the point above, does not clear either way. Revisit if
      #   crewai relaxes its chromadb pin, or if chromadb ships a real fix.
      #   Not reachable from this service either way:
      #   services/orchestrator/rag_integration.py uses chromadb.HttpClient()
      #   only -- FuzeAgent is a *client* of an external Chroma server
      #   (CHROMA_HOST/CHROMA_PORT) and never serves the vulnerable endpoint
      #   itself. Chroma appears in no Dockerfile, no compose file and no
      #   Helm chart in this repo. Hardening the Chroma server is the
      #   operator's (FuzeInfra's) responsibility, not this requirements
      #   file's.
      #
      # PYSEC-2026-1325 / CVE-2024-23342 / GHSA-wj6h-64fc-37mp -- ecdsa
      #   RESOLVED, not ignored: auth.py was ported from python-jose to
      #   PyJWT (already a declared dependency; auth.py only ever calls
      #   jwt.decode() -- verification, which the advisory explicitly states
      #   is unaffected). python-jose was the sole source of the unconditional
      #   `ecdsa!=0.15` install_requires in this dependency tree -- verified
      #   by resolving the full, updated requirements.txt: no `ecdsa` package
      #   appears anywhere in the resolved set. No ignore needed.
      run: |
        pip-audit -r requirements.txt --format=json --output=pip-audit-report.json || true
        pip-audit -r requirements.txt \
          --ignore-vuln PYSEC-2026-311

    - name: Upload security reports
      uses: actions/upload-artifact@v7
      with:
        name: security-reports
        path: |
          services/orchestrator/bandit-report.json
          services/orchestrator/pip-audit-report.json
        retention-days: 30

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install linting tools
      run: |
        pip install black isort flake8 mypy
    
    - name: Check code formatting with Black
      # Enforcing (was `|| true`): verified clean against the requirements.txt-pinned
      # black range (>=23.11.0,<27.0.0) — `black --check .` passes with 0 files needing
      # reformat. The `|| true` here was masking nothing; a stale locally-installed
      # black (23.11.0, the range floor) produced spurious diffs during verification —
      # the requirements-range-satisfying latest (26.5.1) is clean.
      working-directory: services/orchestrator
      run: |
        black --check --diff .

    - name: Check import sorting with isort
      # Enforcing (was `|| true`): verified clean (isort --check-only reports 0 files).
      working-directory: services/orchestrator
      run: |
        isort --check-only --diff .
    
    - name: Run flake8 linting
      working-directory: services/orchestrator
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run mypy type checking
      # Report-only, and NOT a decoration: verified 143 real errors across 29 files as
      # of 2026-08-23 (rag_manager.py, knowledge_analytics_service.py and others —
      # attr-defined / arg-type / var-annotated, not just missing annotations), plus a
      # `mypy .` module-resolution config issue (a2a_protocol.py resolves under two
      # names because services/orchestrator/__init__.py makes the scanned root itself
      # a package). Fixing 143 findings across app logic is backend-engineer scope, not
      # CI-wiring; tracked in governance/vacuous-check-policy.json (mode=ramp) so the
      # forthcoming gate-vacuous-check gate (lands via FuzeSDLC canonical sync) does not
      # immediately red this repo on arrival.
      working-directory: services/orchestrator
      run: |
        mypy . --ignore-missing-imports --no-strict-optional || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, lint]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      working-directory: services/orchestrator
      run: |
        docker build -t fuzeagent-orchestrator:test .
    
    - name: Test Docker image
      run: |
        docker run --rm --entrypoint python fuzeagent-orchestrator:test -c "import main_with_hierarchy; print('Docker image works!')"

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: services/ui-react/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: services/ui-react
      run: npm ci --legacy-peer-deps
      # @izzywdev/fuzefront-identity is on GitHub Packages; see services/ui-react/.npmrc.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Run frontend linting
      working-directory: services/ui-react
      run: npm run lint
    
    - name: Run frontend type checking
      working-directory: services/ui-react
      run: npm run type-check
    
    - name: Build frontend
      working-directory: services/ui-react
      run: npm run build
    
    - name: Run unit tests
      working-directory: services/ui-react
      run: npm run test:run
      
    - name: Run tests with coverage
      working-directory: services/ui-react
      run: npm run test:coverage
    
    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: services/ui-react/coverage/coverage-summary.json
        flags: frontend
        name: fuzeagent-frontend
        fail_ci_if_error: false
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage-report
        path: services/ui-react/coverage/
        retention-days: 30

  performance-test:
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'pull_request'
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: ai_context_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      working-directory: services/orchestrator
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-benchmark
    
    - name: Run performance tests
      # Report-only by design, not by omission: pytest-benchmark timing noise on shared
      # CI runners is expected, and whether a perf regression should ever BLOCK a merge
      # is a product decision this PR does not make. Tracked explicitly in
      # governance/vacuous-check-policy.json (mode=ramp, owner backend-engineer) rather
      # than left as an unexplained `|| true`, so the forthcoming gate-vacuous-check gate
      # sees a deliberate, reviewed exception instead of a silent one.
      working-directory: services/orchestrator
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5434/ai_context_test
        REDIS_URL: redis://localhost:6380
        TESTING: 1
      run: |
        python -m pytest tests/ -m "not slow" --benchmark-only --benchmark-json=benchmark.json || true
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results
        path: services/orchestrator/benchmark.json
        retention-days: 30