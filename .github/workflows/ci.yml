name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/ui-react
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./services/ui-react/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      # services/ui-react depends on @izzywdev/fuzefront-identity, which lives on
      # GitHub Packages. Without this the tarball download answers 401 and the whole
      # job dies at install -- see services/ui-react/.npmrc.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Run linting
      run: npm run lint
      
    - name: Type checking
      run: npm run type-check
      
    - name: Build application
      run: npm run build
      
    - name: Run tests
      run: npm run test:run
      
    - name: Run tests with coverage
      run: npm run test:coverage
      
    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./services/ui-react/coverage/coverage-summary.json
        flags: frontend
        name: fuzeagent-frontend
        fail_ci_if_error: false

  lint-and-test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/orchestrator
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort mypy pytest pytest-cov
        
    - name: Code formatting check (Black)
      run: black --check .
      
    - name: Import sorting check (isort)
      run: isort --check-only .
      
    - name: Linting (flake8)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      
    - name: Type checking (mypy)
      # Report-only: same 143 real findings as test.yml's lint job (see its comment) —
      # backend-engineer scope, tracked in governance/vacuous-check-policy.json.
      run: mypy . --ignore-missing-imports
      continue-on-error: true

    - name: Run tests
      # Report-only: this job has NO Postgres/Redis service containers (unlike
      # test.yml's test-backend job, which does and properly enforces its
      # marker-filtered pytest runs), so an unfiltered `pytest --cov=. --cov-report=xml`
      # here fails on missing infra, not on code — flipping to enforcing without adding
      # service containers would just be a new kind of always-red. This job duplicates
      # test.yml's test-backend job; consolidating them is a real fix but is a bigger,
      # more invasive change than this PR's CI-wiring scope. Tracked in
      # governance/vacuous-check-policy.json.
      run: pytest --cov=. --cov-report=xml
      continue-on-error: true

  # Renamed from `security-scan`: test.yml also had a job named `security-scan` (the
  # unrelated bandit/pip-audit backend job, now `backend-security-scan` there) and both
  # surfaced as a check literally named "security-scan" with no way to tell them apart
  # from the check name alone. Neither name is a required status check (branch
  # protection requires only the gate-* contexts from harden-gate.yml), so this rename
  # does not un-gate anything.
  fs-security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  docker-security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker images
      # services/ui-react depends on the private @izzywdev/fuzefront-identity
      # package (GitHub Packages). Its Dockerfile reads the registry token via a
      # BuildKit secret mount (RUN --mount=type=secret,id=github_token), never a
      # build-arg -- a build-arg would bake the token into the image history.
      # --load pulls the built image into the local daemon so Trivy (below) can
      # scan it via the mounted docker.sock.
      run: |
        docker buildx build --load -t fuzeagent-orchestrator:latest ./services/orchestrator
        docker buildx build --load \
          --secret id=github_token,env=GITHUB_TOKEN \
          -t fuzeagent-ui:latest ./services/ui-react
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Trivy on Docker images
      # Report-only: not independently reverifiable from a devops-engineer CI-wiring
      # pass (no docker daemon available for local verification here, and the
      # fuzeagent-ui image build needs a private-registry GITHUB_TOKEN secret). Flipping
      # this to enforcing needs whoever CAN verify current findings are clean (or add a
      # justified per-CVE ignore list) to actually run it — tracked in
      # governance/vacuous-check-policy.json rather than guessed at.
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v ${{ github.workspace }}:/workspace \
          aquasec/trivy:latest image fuzeagent-orchestrator:latest
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v ${{ github.workspace }}:/workspace \
          aquasec/trivy:latest image fuzeagent-ui:latest
      continue-on-error: true

  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js for frontend dependency check
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        
    - name: Frontend dependency audit
      # Report-only: verified 23 current advisories at --audit-level=high (16 high, 3
      # critical) as of 2026-08-23, in devDependencies (vite/vitest/ws transitive
      # chain). Most have `npm audit fix` available, but bumping is a real dependency
      # upgrade with build-breakage risk (vite/vitest majors), not a mechanical
      # CI-wiring change — owner frontend-engineer. Tracked in
      # governance/vacuous-check-policy.json.
      run: |
        cd services/ui-react
        npm audit --audit-level=high
      continue-on-error: true
      
    - name: Setup Python for backend dependency check
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Backend dependency security check
      # `safety` 3.x requires an authenticated Safety-Platform session and
      # crashes headless without one; pip-audit (PyPA, OSV.dev-backed) does
      # the same job with no login required. See test.yml's backend-security-scan job.
      #
      # Enforcing (was `continue-on-error: true`): the two per-advisory exceptions below
      # are the SAME already-reviewed, no-upstream-fix findings test.yml's
      # backend-security-scan job documents in full (PYSEC-2026-311 / chromadb,
      # PYSEC-2026-1325 / ecdsa — same requirements.txt, same packages, same reasoning).
      # Reusing an already-justified exception rather than leaving this bare and hoping
      # it happens to match.
      run: |
        cd services/orchestrator
        pip install --upgrade pip
        pip install pip-audit
        pip-audit -r requirements.txt \
          --ignore-vuln PYSEC-2026-311 \
          --ignore-vuln PYSEC-2026-1325