# Only forward the WebSocket upgrade protocol, never arbitrary client values.
map $http_upgrade $websocket_upgrade {
    default "";
    ~*^websocket$ websocket;
}
map $websocket_upgrade $websocket_connection {
    default close;
    websocket upgrade;
}

server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    # X-Frame-Options omitted — FuzeAgent is embedded as a Module Federation remote
    # in FuzeFront (app.fuzefront.com). Use frame-ancestors in CSP instead.
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors https://app.fuzefront.com https://*.fuzefront.com" always;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # remoteEntry.js must never be cached stale (both same-origin /apps/fuzeagent and legacy /remoteEntry.js).
    location = /apps/fuzeagent/remoteEntry.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri /apps/fuzeagent/remoteEntry.js /remoteEntry.js =404;
    }

    location = /remoteEntry.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri /apps/fuzeagent/remoteEntry.js =404;
    }

    # Reverse-proxy backend APIs for the federated mount (app.fuzefront.com/apps/fuzeagent/api/*).
    location ^~ /apps/fuzeagent/api/hierarchy/ {
        resolver 10.43.0.10 valid=30s;
        set $hier http://hierarchy-api:8006;
        rewrite ^/apps/fuzeagent/api/hierarchy/(.*)$ /$1 break;
        proxy_pass $hier;
    }

    location ^~ /apps/fuzeagent/api/ {
        resolver 10.43.0.10 valid=30s;
        set $orch http://orchestrator:8000;
        rewrite ^/apps/fuzeagent/api/(.*)$ /api/$1 break;
        proxy_pass $orch;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $websocket_upgrade;
        proxy_set_header Connection $websocket_connection;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    # MFE assets — same-origin portal mount at app.fuzefront.com/apps/fuzeagent/*
    location ^~ /apps/fuzeagent/ {
        add_header Access-Control-Allow-Origin * always;
        try_files $uri $uri/ /apps/fuzeagent/index.html /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin * always;
    }

    # Handle client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}