server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    # X-Frame-Options omitted — FuzeAgent is embedded as a Module Federation remote
    # in FuzeFront (app.fuzefront.com). Use frame-ancestors in CSP instead.
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors https://app.fuzefront.com https://*.fuzefront.com" always;
    # CORS: allow FuzeFront shell to load remoteEntry.js cross-origin.
    add_header Access-Control-Allow-Origin "https://app.fuzefront.com" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # MFE assets — served for FuzeFront module federation at /apps/fuzeagent/.
    #
    # This repo has ONE build (package.json has no separate build:mfe target,
    # unlike FuzeKeys), and vite's `base` is set to /apps/fuzeagent/ for that
    # single build (services/ui-react/vite.config.ts). That means EVERY asset
    # reference this build emits — in the admin-console index.html served at
    # `/` on fuzeagent.prod.fuzefront.com, AND in remoteEntry.js served at
    # `/apps/fuzeagent/` on app.fuzefront.com — points at the /apps/fuzeagent/
    # prefix. The Dockerfile still copies the build FLAT to
    # /usr/share/nginx/html (no nested apps/fuzeagent/ subdirectory), so this
    # location aliases the URL prefix straight back to the docroot rather than
    # to a nested build output directory (contrast FuzeKeys'
    # frontend/nginx.conf, which aliases into a real apps/fuzekeys/
    # subdirectory because it builds MFE and standalone separately). If a
    # future change splits this UI into separate standalone/MFE builds the way
    # FuzeKeys does, this alias target must move from the docroot to that
    # build's nested output dir — that is a build-layout decision for whoever
    # makes that split, not assumed here.
    #
    # ^~ stops nginx from falling through to the `~* \.(js|css|...)$` regex
    # location below, so these CORS/no-cache headers are the ones that apply.
    location ^~ /apps/fuzeagent/ {
        alias /usr/share/nginx/html/;
        add_header Access-Control-Allow-Origin "https://app.fuzefront.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors https://app.fuzefront.com https://*.fuzefront.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets — must repeat CORS/security headers because nginx
    # stops inheriting server-block add_header once a location has its own.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "https://app.fuzefront.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors https://app.fuzefront.com https://*.fuzefront.com" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}