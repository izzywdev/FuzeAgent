server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    # X-Frame-Options omitted — FuzeAgent is embedded as a Module Federation remote
    # in FuzeFront (app.fuzefront.com). Use frame-ancestors in CSP instead.
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors https://app.fuzefront.com https://*.fuzefront.com" always;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # remoteEntry.js must never be cached stale (both same-origin /apps/fuzeagent and legacy /remoteEntry.js).
    location = /apps/fuzeagent/remoteEntry.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri /apps/fuzeagent/remoteEntry.js /remoteEntry.js =404;
    }

    location = /remoteEntry.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri /apps/fuzeagent/remoteEntry.js =404;
    }

    # MFE assets — same-origin portal mount at app.fuzefront.com/apps/fuzeagent/*
    location ^~ /apps/fuzeagent/ {
        add_header Access-Control-Allow-Origin * always;
        try_files $uri $uri/ /apps/fuzeagent/index.html /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin * always;
    }

    # Handle client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}